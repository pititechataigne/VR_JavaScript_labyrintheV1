<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  
  <body>
    <a-scene>
        <a-assets>
          <a-asset-item id="obj-tree" src="./assets/3D_models/exp2_obj_lowpoly_tree/Lowpoly_tree_sample.obj"></a-asset-item>
          <a-asset-item id="mtl-tree" src="./assets/3D_models/exp2_obj_lowpoly_tree/Lowpoly_tree_sample.mtl"></a-asset-item>

          <a-asset-item id="obj-skull" src="./assets/3D_models/exp3_obj_skull/12140_Skull_v3_L2.obj"></a-asset-item>
          <a-asset-item id="mtl-skull" src="./assets/3D_models/exp3_obj_skull/12140_Skull_v3_L2.mtl"></a-asset-item>
        </a-assets>

         <a-entity id="arbre" obj-model="obj: #obj-tree; mtl: #mtl-tree" 
          position="0 0 0" width="4" height="4" scale="0.1 0.1 0.1" ></a-entity>

         <a-entity obj-model="obj: #obj-skull; mtl: #mtl-skull" 
          position="0 0 0" width="4" height="4" scale="0.5 0.5 0.5" ></a-entity>

         <a-plane position="0 0 0" material="side: double" rotation="-90 0 0" width="4" height="4" color="red"></a-plane>
      
     
      
    </a-scene>

    

  </body>

</html>
